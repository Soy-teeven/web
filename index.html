<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de Monedas</title>
</head>
<body>
    <h1>Conversor de Monedas</h1>
    <div id="formulario">
        Cantidad en Dólares (USD): <input type="number" id="cantidad"><br>
        Moneda de destino: 
        <select id="selectorMoneda">
            <option value="">Sin datos</option>
        </select><br>
    </div>
    <br>
    <div id="botones">
        <input type="button" id="btnConvertir" value="Realizar Conversión">
        <input type="button" id="btnGuardar" value="Guardar Conversión">
    </div>
    <br>
    <div id="mensajes" style="color: red; font-weight: bold;"></div>
    <br>
    <div id="resultado" style="color: blue; font-weight: bold;"></div>
    <br>
    <div id="informacion" style="border: 1px solid black; padding: 10px; width: 300px;">
        No hay conversión guardada.
    </div>

    <!-- jQuery local primero -->
    <script src="libs/jquery/jquery.min.js"></script>
    <!-- Script propio al final -->
    <script src="script.js"></script>
</body>
</html>
